name: QA Automation

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: Run smoke suite
        env:
          ENV: staging
          COMPANY1_ADMIN_EMAIL: ${{ secrets.COMPANY1_ADMIN_EMAIL }}
          COMPANY1_ADMIN_PASSWORD: ${{ secrets.COMPANY1_ADMIN_PASSWORD }}
          COMPANY2_USER_EMAIL: ${{ secrets.COMPANY2_USER_EMAIL }}
          COMPANY2_USER_PASSWORD: ${{ secrets.COMPANY2_USER_PASSWORD }}
          COMPANY1_API_TOKEN: ${{ secrets.COMPANY1_API_TOKEN }}
          COMPANY2_API_TOKEN: ${{ secrets.COMPANY2_API_TOKEN }}
          E2E_2FA_BYPASS_TOKEN: ${{ secrets.E2E_2FA_BYPASS_TOKEN }}
        run: pytest -m "smoke or integration" --browser=${{ matrix.browser }} --html=reports/report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-artifacts-${{ matrix.browser }}
          path: reports/

  nightly-cross-browser:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - run: pytest -m "regression or security" --browser=${{ matrix.browser }} -n auto --html=reports/report.html --self-contained-html
