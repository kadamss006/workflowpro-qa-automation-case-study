[pytest]
addopts = -ra --strict-markers --tb=short
markers =
    smoke: critical build verification tests
    regression: broader functional regression tests
    integration: API + UI integration tests
    security: tenant isolation and authorization tests
    browserstack: tests requiring BrowserStack credentials
    mobile: mobile web or native mobile validation
    destructive: tests that create or delete server-side data
log_cli = true
log_cli_level = INFO
timeout = 120
